<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tic Tac Toe</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Your custom CSS -->
  <link rel="stylesheet" href="Style.css">
  <!-- Confetti JS -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
  <div class="container d-flex flex-column align-items-center min-vh-100 justify-content-center py-4">
    <h1 class="text-white text-center mb-4" id="head">Tic-Tac-Toe</h1>

    <div class="side text-center mb-4">
      <div class="d-flex align-items-center justify-content-center gap-3">
        <span id="pointing">👉🏽</span>
        <h2 id="result" class="m-0">Player X's Turn</h2>
      </div>
    </div>

    <div class="game-container">
      <div class="game row g-3">
        <div class="col-4"><div class="box" data-cell="0" onclick="handleClick(0)"></div></div>
        <div class="col-4"><div class="box" data-cell="1" onclick="handleClick(1)"></div></div>
        <div class="col-4"><div class="box" data-cell="2" onclick="handleClick(2)"></div></div>
        <div class="col-4"><div class="box" data-cell="3" onclick="handleClick(3)"></div></div>
        <div class="col-4"><div class="box" data-cell="4" onclick="handleClick(4)"></div></div>
        <div class="col-4"><div class="box" data-cell="5" onclick="handleClick(5)"></div></div>
        <div class="col-4"><div class="box" data-cell="6" onclick="handleClick(6)"></div></div>
        <div class="col-4"><div class="box" data-cell="7" onclick="handleClick(7)"></div></div>
        <div class="col-4"><div class="box" data-cell="8" onclick="handleClick(8)"></div></div>
      </div>
    </div>

    <button class="btn mt-4" onclick="restartGame()">RESTART</button>
  </div>

  <script src="Script.js"></script>
</body>
</html>
